<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Selecciona tu fecha</title>

    <!-- SCRIPT DE VIVENU -->
    <script
        type="text/javascript"
        src="https://vivenu.dev/web/deliver/js/v1/embed.js">
    </script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f7fc;
            color: #333;
        }

        /* =========================
           ENCABEZADO
        ========================= */

        header {
            background: linear-gradient(135deg, #0057bd, #0875dc);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            color: #ffd400;
            font-size: 32px;
            text-shadow: 2px 2px 0 #d94b14;
        }

        header p {
            margin-top: 8px;
            font-size: 16px;
        }


        /* =========================
           CONTENEDOR
        ========================= */

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }


        /* =========================
           TITULO
        ========================= */

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h2 {
            color: #075db9;
            font-size: 28px;
        }

        .title p {
            color: #666;
            margin-top: 8px;
        }


        /* =========================
           CALENDARIO
        ========================= */

        .calendar {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,.12);
        }


        /* =========================
           CABECERA CALENDARIO
        ========================= */

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .calendar-header h3 {
            color: #075db9;
            font-size: 24px;
            text-transform: capitalize;
        }

        .month-button {
            background: #075db9;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 5px;
            font-size: 20px;
            cursor: pointer;
        }

        .month-button:hover {
            background: #00478f;
        }


        /* =========================
           DIAS DE LA SEMANA
        ========================= */

        .weekdays,
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .weekdays div {
            text-align: center;
            font-weight: bold;
            color: #075db9;
            padding: 10px 5px;
        }


        /* =========================
           DIAS
        ========================= */

        .day {
            min-height: 80px;

            border: 1px solid #dce5ef;
            background: #fafcff;

            border-radius: 6px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-size: 18px;
            font-weight: bold;

            color: #075db9;

            text-decoration: none;

            transition: .2s;
        }


        .day:hover {
            background: #0875dc;
            color: white;

            transform: translateY(-3px);

            box-shadow: 0 4px 10px rgba(0,0,0,.15);
        }


        /* =========================
           DIAS SIN ENLACE
        ========================= */

        .empty-day {
            min-height: 80px;

            border: 1px solid #e5e5e5;
            background: #f1f3f5;

            border-radius: 6px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #aaa;

            font-size: 18px;
            font-weight: bold;
        }


        /* =========================
           ESPACIOS ANTES DEL MES
        ========================= */

        .empty {
            min-height: 80px;
            background: transparent;
        }


        /* =========================
           DIA ACTUAL
        ========================= */

        .today {
            background: #ff711f;
            color: white;

            border-color: #ff711f;
        }

        .today:hover {
            background: #e95708;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 50px;

            background: #064b9d;

            color: white;

            text-align: center;

            padding: 30px;
        }

        footer h2 {
            color: #ffd400;
            margin-bottom: 8px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width: 650px) {

            .calendar {
                padding: 12px;
            }

            .weekdays,
            .days {
                gap: 4px;
            }

            .day,
            .empty,
            .empty-day {
                min-height: 55px;
            }

            .day,
            .empty-day {
                font-size: 14px;
            }

            .weekdays div {
                font-size: 11px;
                padding: 5px 2px;
            }

            .calendar-header h3 {
                font-size: 19px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         ENCABEZADO
    ========================= -->

    <header>

        <h1>🌊 AQUA AVENTURA</h1>

        <p>
            Selecciona el día de tu visita
        </p>

    </header>


    <!-- =========================
         CONTENIDO
    ========================= -->

    <main class="container">


        <div class="title">

            <h2>
                📅 Selecciona una fecha
            </h2>

            <p>
                Haz clic sobre el día que deseas visitar el parque.
            </p>

        </div>


        <!-- =========================
             CALENDARIO
        ========================= -->

        <section class="calendar">


            <!-- CAMBIO DE MES -->

            <div class="calendar-header">

                <button
                    class="month-button"
                    onclick="previousMonth()">
                    ‹
                </button>


                <h3 id="monthTitle">
                    Agosto 2026
                </h3>


                <button
                    class="month-button"
                    onclick="nextMonth()">
                    ›
                </button>

            </div>


            <!-- =========================
                 DIAS DE LA SEMANA
            ========================= -->

            <div class="weekdays">

                <div>DOM</div>
                <div>LUN</div>
                <div>MAR</div>
                <div>MIÉ</div>
                <div>JUE</div>
                <div>VIE</div>
                <div>SÁB</div>

            </div>


            <!-- =========================
                 DIAS
            ========================= -->

            <div
                class="days"
                id="calendarDays">
            </div>


        </section>


    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <h2>
            🌊 AQUA AVENTURA
        </h2>

        <p>
            Parque Acuático • Diversión • Aventura
        </p>

    </footer>


    <script>


        /* =====================================
           CONFIGURACIÓN
        ===================================== */

        let currentDate = new Date(2026, 7, 1);


        /* =====================================
           ENLACES DE VIVENU POR FECHA
           
           IMPORTANTE:
           Aquí colocas el enlace /event/
           correspondiente a cada día.
        ===================================== */

        const enlaces = {

            "2026-08-01":
                "https://prueba.tuticket.com.mx/checkout/tepetongo-parque-acuatico-kraonb?useEmbed=true",

            "2026-08-02":
                "https://prueba.tuticket.com.mx/checkout/tepetongo-parque-acuatico-han1qz?useEmbed=true",

            "2026-08-03":
                "https://prueba.tuticket.com.mx/checkout/tepetongo-parque-acuatico-njib57?useEmbed=true",

            "2026-08-04":
                "https://prueba.tuticket.com.mx/checkout/tepetongo-parque-acuatico-7y8ltd?useEmbed=true",

            "2026-08-05":
                "dia-05.html",

            "2026-08-06":
                "dia-06.html",

            "2026-08-07":
                "dia-07.html",

            "2026-08-08":
                "dia-08.html",

            "2026-08-09":
                "dia-09.html",

            "2026-08-10":
                "dia-10.html",

            "2026-08-11":
                "dia-11.html",

            "2026-08-12":
                "dia-12.html",

            "2026-08-13":
                "dia-13.html",

            "2026-08-14":
                "dia-14.html",

            "2026-08-15":
                "dia-15.html",

            "2026-08-16":
                "dia-16.html",

            "2026-08-17":
                "dia-17.html",

            "2026-08-18":
                "dia-18.html",

            "2026-08-19":
                "dia-19.html",

            "2026-08-20":
                "dia-20.html",

            "2026-08-21":
                "dia-21.html",

            "2026-08-22":
                "dia-22.html",

            "2026-08-23":
                "dia-23.html",

            "2026-08-24":
                "dia-24.html",

            "2026-08-25":
                "dia-25.html",

            "2026-08-26":
                "dia-26.html",

            "2026-08-27":
                "dia-27.html",

            "2026-08-28":
                "dia-28.html",

            "2026-08-29":
                "dia-29.html",

            "2026-08-30":
                "dia-30.html",

            "2026-08-31":
                ""

        };


        /* =====================================
           NOMBRES DE LOS MESES
        ===================================== */

        const months = [

            "enero",
            "febrero",
            "marzo",
            "abril",
            "mayo",
            "junio",
            "julio",
            "agosto",
            "septiembre",
            "octubre",
            "noviembre",
            "diciembre"

        ];


        /* =====================================
           CREAR CALENDARIO
        ===================================== */

        function renderCalendar() {


            const year =
                currentDate.getFullYear();


            const month =
                currentDate.getMonth();


            /* TITULO DEL MES */

            document.getElementById(
                "monthTitle"
            ).textContent =
                months[month] + " " + year;


            /* PRIMER DIA DEL MES */

            const firstDay =
                new Date(
                    year,
                    month,
                    1
                ).getDay();


            /* NUMERO DE DIAS DEL MES */

            const daysInMonth =
                new Date(
                    year,
                    month + 1,
                    0
                ).getDate();


            /* CONTENEDOR */

            const calendar =
                document.getElementById(
                    "calendarDays"
                );


            calendar.innerHTML = "";


            /* =================================
               ESPACIOS ANTES DEL PRIMER DIA
            ================================= */

            for (
                let i = 0;
                i < firstDay;
                i++
            ) {

                const empty =
                    document.createElement("div");

                empty.className = "empty";

                calendar.appendChild(empty);

            }


            /* =================================
               CREAR DIAS
            ================================= */

            for (
                let day = 1;
                day <= daysInMonth;
                day++
            ) {


                /* FORMATO:

                   2026-08-19
                */

                const dateKey =
                    year +
                    "-" +
                    String(month + 1).padStart(2, "0") +
                    "-" +
                    String(day).padStart(2, "0");


                /* =================================
                   SI EXISTE ENLACE
                ================================= */

                if (enlaces[dateKey]) {


                    /*
                       CREAR <a>

                       En lugar de:

                       <button>

                       ahora será:

                       <a class="day vivenu-btn yourStylingClass">
                    */

                    const button =
                        document.createElement("a");


                    button.className =
                        "day vivenu-btn yourStylingClass";


                    button.textContent =
                        day;


                    button.href =
                        enlaces[dateKey];


                    /*
                       IMPORTANTE:
                       No usamos onclick ni
                       window.location.href.

                       Vivenu detectará el enlace
                       gracias a la clase:
                       vivenu-btn
                    */


                    /* =================================
                       MARCAR DIA ACTUAL
                    ================================= */

                    const today =
                        new Date();


                    if (
                        day === today.getDate() &&
                        month === today.getMonth() &&
                        year === today.getFullYear()
                    ) {

                        button.classList.add("today");

                    }


                    calendar.appendChild(button);

                }


                /* =================================
                   SI NO EXISTE ENLACE
                ================================= */

                else {

                    const emptyDay =
                        document.createElement("div");


                    emptyDay.className =
                        "empty-day";


                    emptyDay.textContent =
                        day;


                    calendar.appendChild(
                        emptyDay
                    );

                }

            }

        }


        /* =====================================
           MES ANTERIOR
        ===================================== */

        function previousMonth() {

            currentDate.setMonth(
                currentDate.getMonth() - 1
            );

            renderCalendar();

        }


        /* =====================================
           MES SIGUIENTE
        ===================================== */

        function nextMonth() {

            currentDate.setMonth(
                currentDate.getMonth() + 1
            );

            renderCalendar();

        }


        /* =====================================
           INICIAR
        ===================================== */

        renderCalendar();


    </script>


</body>

</html>
